  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #f0fdfa;
      --bg-app: #f1f5f9;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border: #cbd5e1;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      scroll-padding-top: 84px;
      scroll-padding-bottom: 108px;
      -webkit-font-smoothing: antialiased;
    }
    input, select, textarea, button {
      font-family: inherit;
      font-size: 16px;
    }
    .app-shell {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f8fafc;
      position: relative;
      padding-top: 0;
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      padding-bottom: calc(88px + var(--safe-bottom));
      box-shadow: 0 0 24px rgba(15, 23, 42, 0.08);
      overflow-x: hidden;
    }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: #ffffff;
      padding: calc(8px + var(--safe-top)) 10px 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(15, 118, 110, 0.2);
    }
    .app-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .app-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      flex-shrink: 0;
      border: 1.5px solid rgba(255,255,255,0.4);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .icon-btn {
      min-height: 48px;
      min-width: 48px;
      padding: 0 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.14);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .icon-btn:active {
      transform: scale(0.97);
      background: rgba(255,255,255,0.25);
    }
    .screen-container {
      padding: 10px;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
    .section-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      max-width: 100%;
      overflow-x: hidden;
    }
    .step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #0f766e;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      margin: 0 0 10px 0;
    }
    .btn-touch {
      min-height: 48px;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
      word-break: break-word;
      max-width: 100%;
    }
    .btn-touch:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: #0f766e;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.22);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #1e293b;
      border-color: #cbd5e1;
    }
    .btn-outline-teal {
      background: #f0fdfa;
      color: #0f766e;
      border-color: #5eead4;
    }
    .btn-danger {
      background: #fef2f2;
      color: #b91c1c;
      border-color: #fecaca;
    }
    .btn-warning {
      background: #fffbeb;
      color: #b45309;
      border-color: #fde68a;
    }
    .class-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .class-pill {
      min-height: 50px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px 4px;
      text-align: center;
      min-width: 0;
    }
    .class-pill.active {
      background: #0f766e;
      color: #ffffff;
      border-color: #0f766e;
      box-shadow: 0 2px 8px rgba(15, 118, 110, 0.25);
    }
    .class-pill span.sub {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.88;
    }
    .input-field {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 16px;
      outline: none;
    }
    .input-field:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }
    input[type="date"].input-field {
      font-size: 13px;
      padding: 6px;
      min-width: 0;
      max-width: 100%;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .status-paid { background-color: #dcfce7; color: #14532d; border-color: #86efac; }
    .status-partial { background-color: #fef3c7; color: #78350f; border-color: #fcd34d; }
    .status-unpaid { background-color: #fee2e2; color: #7f1d1d; border-color: #fca5a5; }
    .status-overpaid { background-color: #f3e8ff; color: #4c1d95; border-color: #d8b4fe; }
    .status-neutral { background-color: #e2e8f0; color: #1e293b; border-color: #cbd5e1; }
    .student-row {
      width: 100%;
      min-height: 58px;
      padding: 10px;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      text-align: left;
    }
    .student-row.selected {
      border-color: #0f766e;
      background: #f0fdfa;
    }
    .student-row.just-collected {
      border: 2px solid #10b981 !important;
      background: #ecfdf5 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }
    .student-stt {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .book-choice-card {
      width: 100%;
      min-height: 64px;
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      text-align: left;
    }
    .book-choice-card.selected {
      border-color: #0f766e;
      background: #f0fdfa;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-top: 1px solid #cbd5e1;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      padding: 4px calc(2px + var(--safe-right)) calc(4px + var(--safe-bottom)) calc(2px + var(--safe-left));
      z-index: 40;
      box-shadow: 0 -2px 10px rgba(15, 23, 42, 0.06);
    }
    .nav-btn {
      min-height: 50px;
      border: none;
      background: transparent;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      padding: 4px 1px;
      min-width: 0;
    }
    .nav-btn.active {
      color: #0f766e;
      background: #f0fdfa;
    }

    function generateUUID() {
      if (typeof crypto !== "undefined" && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
        const r = (Math.random() * 16) | 0;
        const v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function normalizeVN(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function formatVND(amount) {
      const num = Math.round(Number(amount) || 0);
      const sign = num < 0 ? "-" : "";
      const absStr = Math.abs(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return sign + absStr + " ₫";
    }

    function getVNParts(isoOrDate) {
      const d = isoOrDate ? new Date(isoOrDate) : new Date();
      try {
        const fmt = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Ho_Chi_Minh",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });
        const parts = {};
        fmt.formatToParts(d).forEach(p => { parts[p.type] = p.value; });
        return {
          year: parts.year || "2026",
          month: parts.month || "11",
          day: parts.day || "11",
          hour: parts.hour === "24" ? "00" : (parts.hour || "08"),
          minute: parts.minute || "00",
          second: parts.second || "00"
        };
      } catch (e) {
        return {
          year: String(d.getFullYear()),
          month: String(d.getMonth() + 1).padStart(2, "0"),
          day: String(d.getDate()).padStart(2, "0"),
          hour: String(d.getHours()).padStart(2, "0"),
          minute: String(d.getMinutes()).padStart(2, "0"),
          second: String(d.getSeconds()).padStart(2, "0")
        };
      }
    }

    function formatDateTimeVN(isoStr) {
      if (!isoStr) return "";
      const p = getVNParts(isoStr);
      return `${p.day}/${p.month}/${p.year} ${p.hour}:${p.minute}`;
    }

    function getVNDateKey(isoStr) {
      if (!isoStr) return "";
      const p = getVNParts(isoStr);
      return `${p.year}-${p.month}-${p.day}`;
    }

    function getExcelFileName(isoStr) {
      const p = getVNParts(isoStr || new Date().toISOString());
      return `Thu_tien_sach_${p.year}-${p.month}-${p.day}_${p.hour}-${p.minute}.xlsx`;
    }

    function getBackupZipFileName(isoStr) {
      const p = getVNParts(isoStr || new Date().toISOString());
      return `Thu_tien_sach_backup_${p.year}-${p.month}-${p.day}_${p.hour}-${p.minute}.zip`;
    }

    function isValidPhoneVN(phone) {
      if (!phone) return false;
      const cleaned = String(phone).replace(/[\s.\-()]/g, "");

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Simple synchronous SHA-256 / FNV-1a hex checksum for backup integrity
    function computeChecksumHex(str) {
      let h1 = 0xdeadbeef ^ str.length;
      let h2 = 0x41c6ce57 ^ str.length;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }

      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (h2 >>> 0).toString(16).padStart(8, "0") + (h1 >>> 0).toString(16).padStart(8, "0");

      const expiresAt = Date.now() + ttlSeconds * 1000;
      const token = computeChecksumHex(`${imageRecord.storage_path}::${user.id}::${expiresAt}`);
      return {
        signedUrl: `https://private-storage.supabase.co/storage/v1/object/sign/transaction-images/${imageRecord.storage_path}?token=${token}&exp=${expiresAt}`,

        storagePath: imageRecord.storage_path,

          assertAuthenticated();
          if (nowMs > expiresAt) {

          return privateImageStore[imageRecord.storage_path] || imageRecord.previewCache || "";

    // 4. CORE ENGINE: STATUS, AUDIT LOGS, IDEMPOTENCY, 9-SHEET EXCEL & ZIP BACKUP

    function appendAuditLog(targetDb, action, entityType, entityId, oldData, newData) {
      if (!targetDb.audit_logs) targetDb.audit_logs = [];
      const entry = {
        id: generateUUID(),
        user_id: OWNER_UUID,
        owner_id: OWNER_UUID,
        action,
        entity_type: entityType,
        entity_id: String(entityId || ""),
        old_data: oldData ? JSON.parse(JSON.stringify(oldData)) : null,
        new_data: newData ? JSON.parse(JSON.stringify(newData)) : null,
        created_at: new Date().toISOString(),
        created_by: OWNER_UUID
      };
      targetDb.audit_logs.unshift(entry);
      return entry;
    }

    // Idempotency Registry to prevent double-submit (Section 9)
    const processedIdempotencyKeys = new Set();
    let isSubmittingLock = false;

    function createTransactionWithIdempotency(targetDb, payload) {
      assertAuthenticated();
      if (typeof navigator !== "undefined" && navigator.onLine === false) {
        throw new Error("NETWORK_OFFLINE: Mạng bị ngắt khi giao dịch đang được lưu. Vui lòng kiểm tra kết nối Internet!");
      }
      if (isSubmittingLock) {
        throw new Error("DOUBLE_SUBMIT_LOCKED: Giao dịch đang được xử lý, vui lòng không bấm hai lần!");
      }
      const idemKey = payload.idempotency_key || `${payload.studentId}_${payload.bookId}_${payload.amountReceived}_${payload.type}`;
      const existingDup = (targetDb.transactions || []).find(t => t.idempotency_key === idemKey && t.status !== "Đã hủy");
      if (processedIdempotencyKeys.has(idemKey) || existingDup) {
        throw new Error("IDEMPOTENCY_DUPLICATE: Đã chặn tạo giao dịch trùng khi bấm xác nhận hai lần!");
      }

      isSubmittingLock = true;
      try {
        processedIdempotencyKeys.add(idemKey);
        const nowIso = payload.createdAt || new Date().toISOString();
        const p = getVNParts(nowIso);
        const seq = String((targetDb.transactions ? targetDb.transactions.length : 0) + 1).padStart(3, "0");
        const txId = payload.id || `GD-${p.year}${p.month}${p.day}-${seq}`;
        const snapPrice = payload.book_price_snapshot !== undefined ? Number(payload.book_price_snapshot) : Number(payload.bookPriceAtTransaction || 0);

        const newTx = {
          id: txId,
          transaction_code: txId,
          idempotency_key: idemKey,
          user_id: OWNER_UUID,
          owner_id: OWNER_UUID,
          studentId: payload.studentId,
          student_id: payload.studentId,
          studentName: payload.studentName,
          stt: payload.stt,
          classId: payload.classId || "",
          class_id: payload.classId || "",
          className: payload.className,
          grade: payload.grade,
          bookId: payload.bookId,
          book_id: payload.bookId,
          bookCode: payload.bookCode,
          bookTitle: payload.bookTitle,
          book_price_snapshot: snapPrice,
          bookPriceAtTransaction: snapPrice,
          amountDue: Number(payload.amountDue) || 0,
          amount_due: Number(payload.amountDue) || 0,
          amountReceived: Number(payload.amountReceived) || 0,
          amount_received: Number(payload.amountReceived) || 0,
          balanceAfter: Number(payload.balanceAfter) || 0,
          balance_after: Number(payload.balanceAfter) || 0,
          type: payload.type || "Thu tiền",
          transaction_type: payload.type || "Thu tiền",
          paymentMethod: payload.paymentMethod || "Tiền mặt",
          payment_method: payload.paymentMethod || "Tiền mặt",
          imageId: payload.imageId || "",
          createdAt: nowIso,
          created_at: nowIso,
          updated_at: nowIso,
          note: payload.note || "",
          status: "Hoạt động",
          cancelReason: "",
          cancel_reason: "",
          cancelled_at: null,
          refTransactionId: payload.refTransactionId || "",
          ref_transaction_id: payload.refTransactionId || null,
          created_by: OWNER_UUID,
          ownerId: OWNER_UUID
        };

        targetDb.transactions.unshift(newTx);
        appendAuditLog(
          targetDb,
          payload.type === "Hoàn tiền" ? "REFUND_TRANSACTION" : (payload.type === "Miễn hoặc giảm" ? "DISCOUNT_TRANSACTION" : "CREATE_TRANSACTION"),
          "transactions",
          txId,
          null,
          newTx
        );
        return newTx;
      } finally {
        isSubmittingLock = false;
      }
    }

    function computeStudentBookStatus(student, book, allTransactions) {
      const txs = (allTransactions || []).filter(
        t => (t.studentId === student.id || t.student_id === student.id) && (t.bookId === book.id || t.book_id === book.id)
      );
      const validTxs = txs.filter(t => t.status !== "Đã hủy");
      const cancelledTxs = txs.filter(t => t.status === "Đã hủy");

      // Preserve historical book_price_snapshot at transaction time!
      let lockedPrice = Number(book.price) || 0;
      if (validTxs.length > 0) {
        const sortedValid = [...validTxs].sort((a, b) => new Date(a.createdAt || a.created_at) - new Date(b.createdAt || b.created_at));
        const firstTx = sortedValid[0];
        if (firstTx.book_price_snapshot !== undefined && firstTx.book_price_snapshot !== null) {
          lockedPrice = Number(firstTx.book_price_snapshot);
        } else if (firstTx.bookPriceAtTransaction !== undefined && firstTx.bookPriceAtTransaction !== null) {
          lockedPrice = Number(firstTx.bookPriceAtTransaction);
        }
      }

      let collected = 0;
      let discount = 0;
      let refunded = 0;
      let hasReturnBook = false;

      validTxs.forEach(t => {
        const amt = Number(t.amountReceived !== undefined ? t.amountReceived : t.amount_received) || 0;
        const tType = t.type || t.transaction_type;
        if (tType === "Thu tiền" || tType === "Điều chỉnh") {
          collected += amt;
        } else if (tType === "Miễn hoặc giảm") {
          discount += amt;
        } else if (tType === "Hoàn tiền") {
          refunded += amt;
        } else if (tType === "Trả sách") {
          hasReturnBook = true;
        }
      });

      const netReceived = Math.max(0, collected - refunded);
      const effectiveDue = hasReturnBook ? 0 : Math.max(0, lockedPrice - discount);
      const shortfall = Math.max(0, effectiveDue - netReceived);
      const overpaid = Math.max(0, netReceived - effectiveDue);

      let status = "Chưa đóng";
      if (hasReturnBook) {
        status = "Đã trả sách";
      } else if (refunded > 0 && netReceived === 0) {
        status = "Đã hoàn tiền";
      } else if (discount > 0 && netReceived === 0) {
        status = "Miễn hoặc giảm";
      } else if (netReceived > effectiveDue && effectiveDue >= 0) {
        status = "Đóng dư";
      } else if (effectiveDue > 0 && netReceived === effectiveDue) {
        status = "Đã đóng đủ";
      } else if (discount >= lockedPrice && lockedPrice > 0) {
        status = "Miễn hoặc giảm";
      } else if (netReceived > 0 && netReceived < effectiveDue) {
        status = "Đóng một phần";
      } else if (validTxs.length === 0 && cancelledTxs.length > 0) {
        status = "Chưa đóng";
      }

      return {
        studentId: student.id,
        bookId: book.id,
        lockedPrice,
        effectiveDue,
        collected,
        discount,
        refunded,
        netReceived,
        shortfall,
        overpaid,
        status,
        hasCancelledOnly: validTxs.length === 0 && cancelledTxs.length > 0,
        validTransactions: validTxs,
        allTransactions: txs
      };
    }

    function computeStudentOverallSummary(student, books, allTransactions) {
      const applicableBooks = (books || []).filter(
        b => Number(b.grade) === Number(student.grade) && (b.status === "selling" || (allTransactions || []).some(t => t.studentId === student.id && t.bookId === b.id && t.status !== "Đã hủy"))
      );
      let totalDue = 0;
      let totalNetReceived = 0;
      let totalShortfall = 0;
      let totalOverpaid = 0;
      let totalDiscount = 0;
      let totalRefunded = 0;
      const bookSummaries = applicableBooks.map(book => {
        const s = computeStudentBookStatus(student, book, allTransactions);
        totalDue += s.effectiveDue;
        totalNetReceived += s.netReceived;
        totalShortfall += s.shortfall;
        totalOverpaid += s.overpaid;
        totalDiscount += s.discount;
        totalRefunded += s.refunded;
        return { book, summary: s };
      });

      let overallStatus = "Chưa đóng";
      const hasAnyPaid = bookSummaries.some(x => x.summary.netReceived > 0);
      const hasAnyOverpaid = bookSummaries.some(x => x.summary.status === "Đóng dư");
      const allPaid = bookSummaries.length > 0 && bookSummaries.every(x => x.summary.shortfall === 0 && (x.summary.netReceived > 0 || x.summary.discount > 0));
      const hasAnyDiscountOnly = !hasAnyPaid && bookSummaries.some(x => x.summary.status === "Miễn hoặc giảm");
      const hasAnyRefundOnly = !hasAnyPaid && bookSummaries.some(x => x.summary.status === "Đã hoàn tiền");

      if (hasAnyOverpaid) overallStatus = "Đóng dư";
      else if (allPaid) overallStatus = "Đã đóng đủ";
      else if (hasAnyPaid) overallStatus = "Đóng một phần";
      else if (hasAnyDiscountOnly) overallStatus = "Miễn hoặc giảm";
      else if (hasAnyRefundOnly) overallStatus = "Đã hoàn tiền";

      return {
        student,
        totalDue,
        totalNetReceived,
        totalShortfall,
        totalOverpaid,
        totalDiscount,
        totalRefunded,
        overallStatus,
        bookSummaries
      };
    }

    function getStatusBadgeHtml(status) {
      const map = {
        "Đã đóng đủ": { cls: "status-paid", icon: "✓" },
        "Đóng một phần": { cls: "status-partial", icon: "◐" },
        "Chưa đóng": { cls: "status-unpaid", icon: "!" },
        "Đóng dư": { cls: "status-overpaid", icon: "+" },
        "Miễn hoặc giảm": { cls: "status-neutral", icon: "★" },
        "Đã hoàn tiền": { cls: "status-neutral", icon: "↩" },
        "Đã trả sách": { cls: "status-neutral", icon: "⇄" },
        "Đã hủy": { cls: "status-neutral", icon: "✕" },
        "Hoạt động": { cls: "status-paid", icon: "✓" },
        "Hợp lệ": { cls: "status-paid", icon: "✓" }
      };
      const item = map[status] || { cls: "status-neutral", icon: "•" };
      return `<span class="status-badge ${item.cls}"><span>${item.icon}</span><span>${escapeHtml(status)}</span></span>`;
    }

    function searchAndSortStudents(students, books, transactions, options = {}) {
      const { query = "", className = "ALL", grade = "ALL", statusFilter = "ALL", prioritizeUnpaid = true } = options;
      const qNorm = normalizeVN(query);
      const qRaw = String(query || "").trim();

      const enriched = (students || []).map(st => ({
        student: st,
        overall: computeStudentOverallSummary(st, books, transactions)
      }));

      const filtered = enriched.filter(({ student, overall }) => {
        if (grade !== "ALL" && Number(student.grade) !== Number(grade)) return false;
        if (className !== "ALL" && student.className !== className) return false;
        if (statusFilter !== "ALL") {
          const matchOverall = overall.overallStatus === statusFilter;
          const matchAnyBook = overall.bookSummaries.some(b => b.summary.status === statusFilter);
          if (!matchOverall && !matchAnyBook) return false;
        }
        if (!qNorm) return true;
        const nameNorm = normalizeVN(student.fullName);
        const sttStr = String(student.stt);
        const classNorm = normalizeVN(student.className);
        const parentNorm = normalizeVN(student.parentName || "");
        return (
          nameNorm.includes(qNorm) ||
          sttStr === qRaw ||
          sttStr.startsWith(qRaw) ||
          `${sttStr} ${nameNorm}`.includes(qNorm) ||
          classNorm.includes(qNorm) ||
          parentNorm.includes(qNorm)
        );
      });

      filtered.sort((a, b) => {
        if (prioritizeUnpaid) {
          const w = (s) => s === "Chưa đóng" ? 0 : (s === "Đóng một phần" ? 1 : (s === "Đã đóng đủ" ? 2 : (s === "Đóng dư" ? 3 : 4)));
          const pa = w(a.overall.overallStatus);
          const pb = w(b.overall.overallStatus);
          if (pa !== pb) return pa - pb;
        }
        if (a.student.className !== b.student.className) return a.student.className.localeCompare(b.student.className);
        return (Number(a.student.stt) || 0) - (Number(b.student.stt) || 0);
      });

      return filtered;
    }

    function findDuplicateRecentTransaction(transactions, studentId, bookId, amountReceived, nowIso) {
      const nowMs = nowIso ? new Date(nowIso).getTime() : Date.now();
      return (transactions || []).find(t => {
        if (t.status === "Đã hủy") return false;
        if (t.studentId !== studentId || t.bookId !== bookId) return false;
        if (Number(t.amountReceived) !== Number(amountReceived)) return false;
        const txMs = new Date(t.createdAt || t.created_at).getTime();
        return Math.abs(nowMs - txMs) / 1000 <= 120;
      });
    }

    function validateCsvImportRows(rawRows, mapping, existingStudents) {
      const seenNameClassInFile = new Set();
      const seenSttClassInFile = new Set();
      const autoSttCounter = {};
      (existingStudents || []).forEach(s => {
        const ck = s.className || "";
        autoSttCounter[ck] = Math.max(autoSttCounter[ck] || 0, Number(s.stt) || 0);
      });

      return rawRows.map((row, index) => {
        const fullName = String(row[mapping.fullName] || "").trim();
        const sttRaw = String(row[mapping.stt] || "").trim();
        const rawClassVal = String(row[mapping.className] || "").replace(/\s*\(https?:\/\/[^)]+\)/g, "").trim();
        const className = rawClassVal;
        if (className && autoSttCounter[className] === undefined) autoSttCounter[className] = 0;
        const stt = sttRaw ? parseInt(sttRaw, 10) : (++autoSttCounter[className]);
        const gradeRaw = String(row[mapping.grade] || "").replace(/[^0-9]/g, "").trim();
        const inferredGrade = gradeRaw ? parseInt(gradeRaw, 10) : (className.includes("10") ? 10 : (className.includes("11") ? 11 : NaN));
        const facebookUrl = String(row[mapping.facebookUrl] || "").trim();
        const parentName = String(row[mapping.parentName] || "").trim();
        const parentPhone = String(row[mapping.parentPhone] || "").trim();
        const statusRaw = String(row[mapping.status] || "Đang học").trim();
        const note = String(row[mapping.note] || "").replace(/\s*\(https?:\/\/[^)]+\)/g, "").trim();

        const errors = [];
        if (!fullName) errors.push("Thiếu họ tên");
        if (!className) errors.push("Thiếu lớp");
        if (inferredGrade !== 10 && inferredGrade !== 11) errors.push("Khối lớp không phải 10 hoặc 11");
        if (parentPhone && !isValidPhoneVN(parentPhone)) errors.push("Số điện thoại không hợp lệ");

        const nameClassKey = `${normalizeVN(fullName)}__${normalizeVN(className)}`;
        const sttClassKey = `${stt}__${normalizeVN(className)}`;

        if (fullName && className) {
          const dupName = (existingStudents || []).some(
            s => normalizeVN(s.fullName) === normalizeVN(fullName) && normalizeVN(s.className) === normalizeVN(className)
          );
          if (dupName || seenNameClassInFile.has(nameClassKey)) errors.push("Học sinh trùng họ tên và lớp");
          seenNameClassInFile.add(nameClassKey);
        }
        if (!isNaN(stt) && className) {
          const dupStt = (existingStudents || []).some(
            s => Number(s.stt) === stt && normalizeVN(s.className) === normalizeVN(className)
          );
          if (dupStt || seenSttClassInFile.has(sttClassKey)) errors.push("STT bị trùng trong cùng lớp");
          seenSttClassInFile.add(sttClassKey);
        }

        return {
          rowIndex: index + 1,
          fullName,
          stt: isNaN(stt) ? index + 1 : stt,
          className,
          grade: inferredGrade,
          facebookUrl,
          parentName,
          parentPhone,
          status: normalizeVN(statusRaw).includes("ngung") ? "inactive" : "studying",
          note,
          errors,
          isValid: errors.length === 0
        };
      });
    }

    // Comprehensive Reporting Engine (includes overpaidList for Section 12 & 13)
    function computeReports(targetDb, filters = {}) {
      assertAuthenticated();
      const { grade = "ALL", className = "ALL", bookId = "ALL", status = "ALL", paymentMethod = "ALL", fromDate = "", toDate = "" } = filters;

      const filteredTxs = (targetDb.transactions || []).filter(tx => {
        if (grade !== "ALL" && Number(tx.grade) !== Number(grade)) return false;
        if (className !== "ALL" && tx.className !== className) return false;
        if (bookId !== "ALL" && tx.bookId !== bookId) return false;
        if (paymentMethod !== "ALL" && tx.paymentMethod !== paymentMethod) return false;
        const dKey = getVNDateKey(tx.createdAt || tx.created_at);
        if (fromDate && dKey < fromDate) return false;
        if (toDate && dKey > toDate) return false;
        return true;
      });

      const validFilteredTxs = filteredTxs.filter(tx => tx.status !== "Đã hủy");

      let totalCash = 0;
      let totalTransfer = 0;
      let totalRefunded = 0;

      validFilteredTxs.forEach(tx => {
        const amt = Number(tx.amountReceived) || 0;
        if (tx.type === "Thu tiền" || tx.type === "Điều chỉnh") {
          if (tx.paymentMethod === "Tiền mặt") totalCash += amt;
          if (tx.paymentMethod === "Chuyển khoản") totalTransfer += amt;
        } else if (tx.type === "Hoàn tiền") {
          totalRefunded += amt;
          if (tx.paymentMethod === "Tiền mặt") totalCash = Math.max(0, totalCash - amt);
          if (tx.paymentMethod === "Chuyển khoản") totalTransfer = Math.max(0, totalTransfer - amt);
        }
      });

      const candidateStudents = (targetDb.students || []).filter(s => {
        if (s.status === "inactive") return false;
        if (grade !== "ALL" && Number(s.grade) !== Number(grade)) return false;
        if (className !== "ALL" && s.className !== className) return false;
        return true;
      });

      const candidateBooks = (targetDb.books || []).filter(b => {
        if (grade !== "ALL" && Number(b.grade) !== Number(grade)) return false;
        if (bookId !== "ALL" && b.id !== bookId) return false;
        return b.status === "selling" || bookId === b.id;
      });

      let totalDue = 0;
      let totalCollected = 0;
      let totalShortfall = 0;
      let totalOverpaid = 0;

      const paidList = [];
      const unpaidList = [];
      const shortfallList = [];
      const overpaidList = [];
      const byClassMap = {};
      const byBookMap = {};

      let countPaidStudents = 0;
      let countUnpaidStudents = 0;
      let countPartialStudents = 0;

      candidateStudents.forEach(student => {
        const studentBooks = candidateBooks.filter(b => Number(b.grade) === Number(student.grade));
        let stDue = 0;
        let stNet = 0;
        let stShortfall = 0;

        studentBooks.forEach(book => {
          const sb = computeStudentBookStatus(student, book, validFilteredTxs);
          if (status !== "ALL" && sb.status !== status) return;

          totalDue += sb.effectiveDue;
          totalCollected += sb.netReceived;
          totalShortfall += sb.shortfall;
          totalOverpaid += sb.overpaid;

          stDue += sb.effectiveDue;
          stNet += sb.netReceived;
          stShortfall += sb.shortfall;

          const rowItem = {
            studentId: student.id,
            stt: student.stt,
            fullName: student.fullName,
            className: student.className,
            grade: student.grade,
            parentName: student.parentName,
            parentPhone: student.parentPhone,
            bookId: book.id,
            bookCode: book.code,
            bookTitle: book.title,
            bookPrice: sb.lockedPrice,
            effectiveDue: sb.effectiveDue,
            netReceived: sb.netReceived,
            shortfall: sb.shortfall,
            overpaid: sb.overpaid,
            status: sb.status
          };

          if (sb.status === "Đã đóng đủ" || sb.status === "Đóng dư") {
            paidList.push(rowItem);
          }
          if (sb.status === "Đóng dư" || sb.overpaid > 0) {
            overpaidList.push(rowItem);
          }
          if (sb.status === "Chưa đóng") {
            unpaidList.push(rowItem);
            if (sb.shortfall > 0) shortfallList.push(rowItem);
          } else if (sb.status === "Đóng một phần") {
            shortfallList.push(rowItem);
          }

          if (!byClassMap[student.className]) {
            byClassMap[student.className] = {
              className: student.className,
              grade: student.grade,
              studentSet: new Set(),
              totalDue: 0,
              totalCollected: 0,
              totalShortfall: 0,
              totalOverpaid: 0
            };
          }
          byClassMap[student.className].studentSet.add(student.id);
          byClassMap[student.className].totalDue += sb.effectiveDue;
          byClassMap[student.className].totalCollected += sb.netReceived;
          byClassMap[student.className].totalShortfall += sb.shortfall;
          byClassMap[student.className].totalOverpaid += sb.overpaid;

          if (!byBookMap[book.id]) {
            byBookMap[book.id] = {
              bookId: book.id,
              bookCode: book.code,
              bookTitle: book.title,
              grade: book.grade,
              currentPrice: book.price,
              studentCount: 0,
              paidCount: 0,
              totalDue: 0,
              totalCollected: 0,
              totalShortfall: 0,
              totalOverpaid: 0
            };
          }
          byBookMap[book.id].studentCount += 1;
          if (sb.status === "Đã đóng đủ" || sb.status === "Đóng dư") byBookMap[book.id].paidCount += 1;
          byBookMap[book.id].totalDue += sb.effectiveDue;
          byBookMap[book.id].totalCollected += sb.netReceived;
          byBookMap[book.id].totalShortfall += sb.shortfall;
          byBookMap[book.id].totalOverpaid += sb.overpaid;
        });

        if (studentBooks.length > 0) {
          if (stNet === 0 && stDue > 0) countUnpaidStudents += 1;
          else if (stShortfall === 0 && stNet > 0) countPaidStudents += 1;
          else if (stNet > 0 && stShortfall > 0) countPartialStudents += 1;
        }
      });

      const byDateMap = {};
      validFilteredTxs.forEach(tx => {
        const dKey = getVNDateKey(tx.createdAt || tx.created_at);
        if (!byDateMap[dKey]) {
          byDateMap[dKey] = { date: dKey, txCount: 0, cashAmount: 0, transferAmount: 0, refundAmount: 0, discountAmount: 0, netCollected: 0 };
        }
        const entry = byDateMap[dKey];
        entry.txCount += 1;
        const amt = Number(tx.amountReceived) || 0;
        if (tx.type === "Thu tiền" || tx.type === "Điều chỉnh") {
          if (tx.paymentMethod === "Tiền mặt") entry.cashAmount += amt;
          if (tx.paymentMethod === "Chuyển khoản") entry.transferAmount += amt;
          entry.netCollected += amt;
        } else if (tx.type === "Hoàn tiền") {
          entry.refundAmount += amt;
          entry.netCollected -= amt;
        } else if (tx.type === "Miễn hoặc giảm") {
          entry.discountAmount += amt;
        }
      });

      const byClass = Object.values(byClassMap).map(c => ({
        className: c.className,
        grade: c.grade,
        studentCount: c.studentSet.size,
        totalDue: c.totalDue,
        totalCollected: c.totalCollected,
        totalShortfall: c.totalShortfall,
        totalOverpaid: c.totalOverpaid
      })).sort((a, b) => a.className.localeCompare(b.className));

      const byBook = Object.values(byBookMap).sort((a, b) => a.bookCode.localeCompare(b.bookCode));
      const byDate = Object.values(byDateMap).sort((a, b) => b.date.localeCompare(a.date));

      return {
        totalDue,
        totalCollected,
        totalShortfall,
        totalOverpaid,
        totalRefunded,
        totalCash,
        totalTransfer,
        countPaidStudents,
        countUnpaidStudents,
        countPartialStudents,
        paidList,
        unpaidList,
        shortfallList,
        overpaidList,
        byClass,
        byBook,
        byDate,
        filteredTxs
      };
    }

    const CRC_TABLE = (function() {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
        t[n] = c >>> 0;
      }
      return t;
    })();

    function crc32(buf) {
      let c = -1;
      for (let i = 0; i < buf.length; i++) c = (c >>> 8) ^ CRC_TABLE[(c ^ buf[i]) & 0xff];
      return (c ^ -1) >>> 0;
    }

    function createZipUint8ArrayFromFiles(files) {
      const enc = new TextEncoder();
      let localSize = 0;
      let centralSize = 0;
      const fileEntries = files.map(f => {
        const nameBytes = enc.encode(f.name);
        const dataBytes = f.data instanceof Uint8Array ? f.data : enc.encode(String(f.data));
        const crc = crc32(dataBytes);
        const size = dataBytes.length;
        const offset = localSize;
        localSize += 30 + nameBytes.length + size;
        centralSize += 46 + nameBytes.length;
        return { nameBytes, data: dataBytes, crc, size, offset };
      });

      const totalZipSize = localSize + centralSize + 22;
      const out = new Uint8Array(totalZipSize);
      const view = new DataView(out.buffer);
      let pos = 0;

      fileEntries.forEach(fe => {
        view.setUint32(pos, 0x04034b50, true); pos += 4;
        view.setUint16(pos, 20, true); pos += 2;
        view.setUint16(pos, 0x0800, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        view.setUint32(pos, fe.crc, true); pos += 4;
        view.setUint32(pos, fe.size, true); pos += 4;
        view.setUint32(pos, fe.size, true); pos += 4;
        view.setUint16(pos, fe.nameBytes.length, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        out.set(fe.nameBytes, pos); pos += fe.nameBytes.length;
        out.set(fe.data, pos); pos += fe.size;
      });

      const centralStart = pos;
      fileEntries.forEach(fe => {
        view.setUint32(pos, 0x02014b50, true); pos += 4;
        view.setUint16(pos, 20, true); pos += 2;
        view.setUint16(pos, 20, true); pos += 2;
        view.setUint16(pos, 0x0800, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        view.setUint32(pos, fe.crc, true); pos += 4;
        view.setUint32(pos, fe.size, true); pos += 4;
        view.setUint32(pos, fe.size, true); pos += 4;
        view.setUint16(pos, fe.nameBytes.length, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        view.setUint16(pos, 0, true); pos += 2;
        view.setUint32(pos, 0, true); pos += 4;
        view.setUint32(pos, fe.offset, true); pos += 4;
        out.set(fe.nameBytes, pos); pos += fe.nameBytes.length;
      });

      const centralEnd = pos;
      view.setUint32(pos, 0x06054b50, true); pos += 4;
      view.setUint16(pos, 0, true); pos += 2;
      view.setUint16(pos, 0, true); pos += 2;
      view.setUint16(pos, fileEntries.length, true); pos += 2;
      view.setUint16(pos, fileEntries.length, true); pos += 2;
      view.setUint32(pos, centralEnd - centralStart, true); pos += 4;
      view.setUint32(pos, centralStart, true); pos += 4;
      view.setUint16(pos, 0, true);
      return out;
    }

    // Parse uncompressed ZIP archive (validating magic bytes & extracting JSON files)
    function parseZipUint8ArrayToFiles(bytes) {
      if (!(bytes instanceof Uint8Array) || bytes.length < 30) {
        throw new Error("INVALID_ZIP: File sao lưu bị hỏng hoặc không phải định dạng ZIP!");
      }
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      if (view.getUint32(0, true) !== 0x04034b50) {
        throw new Error("CORRUPT_ZIP_HEADER: Header file ZIP không hợp lệ hoặc bị hỏng!");
      }
      const dec = new TextDecoder("utf-8");
      const outMap = {};
      let pos = 0;
      while (pos + 30 <= bytes.length) {
        const sig = view.getUint32(pos, true);
        if (sig === 0x02014b50 || sig === 0x06054b50) break;
        if (sig !== 0x04034b50) {
          throw new Error("CORRUPT_ZIP_ENTRY: Cấu trúc entry trong file ZIP bị lỗi!");
        }
        const method = view.getUint16(pos + 8, true);
        const expectedCrc = view.getUint32(pos + 14, true);
        const compSize = view.getUint32(pos + 18, true);
        const nameLen = view.getUint16(pos + 26, true);
        const extraLen = view.getUint16(pos + 28, true);
        const nameStart = pos + 30;
        const dataStart = nameStart + nameLen + extraLen;
        if (dataStart + compSize > bytes.length) {
          throw new Error("TRUNCATED_ZIP: File ZIP bị cắt cụt dữ liệu!");
        }
        if (method !== 0) {
          throw new Error("UNSUPPORTED_ZIP_METHOD: Chỉ hỗ trợ chuẩn STORE ZIP của ứng dụng!");
        }
        const fileName = dec.decode(bytes.subarray(nameStart, nameStart + nameLen));
        const fileData = bytes.subarray(dataStart, dataStart + compSize);
        const actualCrc = crc32(fileData);
        if (actualCrc !== expectedCrc) {
          throw new Error(`CRC_MISMATCH: File ${fileName} trong bản sao lưu bị hỏng dữ liệu!`);
        }
        outMap[fileName] = dec.decode(fileData);
        pos = dataStart + compSize;
      }
      return outMap;
    }

        JSON.stringify(targetDb.students || []) +
        JSON.stringify(targetDb.books || []) +
        JSON.stringify(targetDb.transactions || []);
      const checksum = computeChecksumHex(rawConcat);

      const metadata = {
        schema_version: SCHEMA_VERSION,
        app_version: APP_VERSION,
        backup_at: new Date().toISOString(),
        user_id: user.id,
        record_counts: recordCounts,
        checksum
      };

      const files = [
        { name: "metadata.json", data: JSON.stringify(metadata, null, 2) },
        { name: "classes.json", data: JSON.stringify(targetDb.classes || [], null, 2) },
        { name: "students.json", data: JSON.stringify(targetDb.students || [], null, 2) },
        { name: "books.json", data: JSON.stringify(targetDb.books || [], null, 2) },
        { name: "transactions.json", data: JSON.stringify(targetDb.transactions || [], null, 2) },
        { name: "transaction_images.json", data: JSON.stringify(sanitizedImages, null, 2) },
        { name: "audit_logs.json", data: JSON.stringify(targetDb.audit_logs || [], null, 2) },
        { name: "settings.json", data: JSON.stringify(sanitizedSettings, null, 2) }
      ];

      const zipBytes = createZipUint8ArrayFromFiles(files);
      const p = getVNParts(metadata.backup_at);
      const backupId = generateUUID();
      const cloudPath = `${user.id}/${p.year}/${p.month}/${backupId}.zip`;

      const backupRecord = {
        id: backupId,
        user_id: user.id,
        owner_id: user.id,
        backup_type: "manual_cloud",
        status: "completed",
        started_at: metadata.backup_at,
        completed_at: new Date().toISOString(),
        record_counts: recordCounts,
        file_path: cloudPath,
        checksum,
        error_message: "",
        created_at: metadata.backup_at
      };
      if (!targetDb.backups) targetDb.backups = [];
      targetDb.backups.unshift(backupRecord);
      appendAuditLog(targetDb, "CREATE_BACKUP", "backups", backupId, null, metadata);

      return {
        zipBytes,
        metadata,
        backupRecord,
        fileName: getBackupZipFileName(metadata.backup_at)
      };
    }

    // Validate & Preview Restore from Backup ZIP (Section 23: 9 validation steps + 3 modes + Rollback safety)
    function validateAndPreviewBackupZip(zipBytes, currentDb, mode = "add_only") {
      assertAuthenticated();
      // Step 1: Parse ZIP & detect corruption
      const fileMap = parseZipUint8ArrayToFiles(zipBytes);

      // Step 2 & 3: Check required 8 JSON files & schema_version
      const requiredFiles = [
        "metadata.json", "classes.json", "students.json", "books.json",
        "transactions.json", "transaction_images.json", "audit_logs.json", "settings.json"
      ];
      for (const reqFile of requiredFiles) {
        if (!(reqFile in fileMap)) {
          throw new Error(`MISSING_BACKUP_FILE: Thiếu file bắt buộc '${reqFile}' trong gói ZIP!`);
        }
      }

      let metadata, classes, students, books, transactions, transaction_images, audit_logs, settings;
      try {
        metadata = JSON.parse(fileMap["metadata.json"]);
        classes = JSON.parse(fileMap["classes.json"]);
        students = JSON.parse(fileMap["students.json"]);
        books = JSON.parse(fileMap["books.json"]);
        transactions = JSON.parse(fileMap["transactions.json"]);
        transaction_images = JSON.parse(fileMap["transaction_images.json"]);
        audit_logs = JSON.parse(fileMap["audit_logs.json"]);
        settings = JSON.parse(fileMap["settings.json"]);
      } catch (e) {
        throw new Error("INVALID_JSON_FORMAT: Một trong các file JSON trong gói ZIP bị lỗi cú pháp!");
      }

      if (!metadata || !metadata.schema_version) {
        throw new Error("INVALID_SCHEMA_VERSION: Không tìm thấy schema_version hợp lệ trong metadata.json!");
      }

      // Step 4: Check array structures
      if (!Array.isArray(classes) || !Array.isArray(students) || !Array.isArray(books) || !Array.isArray(transactions)) {
        throw new Error("INVALID_TABLE_STRUCTURE: Cấu trúc bảng dữ liệu trong bản sao lưu không hợp lệ!");
      }

      // Step 5: Foreign key integrity check
      const classNamesSet = new Set(classes.map(c => c.name));
      const classIdsSet = new Set(classes.map(c => c.id));
      for (const st of students) {
        if (!classNamesSet.has(st.className) && !classIdsSet.has(st.classId)) {
          throw new Error(`FOREIGN_KEY_ERROR: Học sinh '${st.fullName}' tham chiếu đến lớp không tồn tại!`);
        }
      }

      // Step 6 & 7: Compute UUID diffs (willAdd, willUpdate, willSkip)
      const calcDiff = (currArr, incomingArr, isImmutableHistory = false) => {
        const currMap = new Map((currArr || []).map(x => [x.id, x]));
        let add = 0, update = 0, skip = 0;
        incomingArr.forEach(item => {
          if (!currMap.has(item.id)) {
            add++;
          } else if (mode === "add_only" || isImmutableHistory) {
            skip++;
          } else {
            update++;
          }
        });
        return { add, update, skip, totalIncoming: incomingArr.length };
      };

      const diffSummary = {
        classes: calcDiff(currentDb.classes, classes),
        students: calcDiff(currentDb.students, students),
        books: calcDiff(currentDb.books, books),
        transactions: calcDiff(currentDb.transactions, transactions, true),
        audit_logs: calcDiff(currentDb.audit_logs, audit_logs, true)
      };

      return {
        valid: true,
        metadata,
        mode,
        diffSummary,
        parsedBundle: { classes, students, books, transactions, transaction_images, audit_logs, settings }
      };
    }

    function executeRestoreFromBackupZip(zipBytes, targetDb, mode, confirmationText) {
      assertAuthenticated();
      if (String(confirmationText || "").trim() !== "XAC NHAN KHOI PHUC") {
        throw new Error("CONFIRMATION_MISMATCH: Vui lòng nhập chính xác chuỗi 'XAC NHAN KHOI PHUC' để thực hiện!");
      }

      // Step 1-7: Validate first BEFORE touching targetDb
      const preview = validateAndPreviewBackupZip(zipBytes, targetDb, mode);

      // Step 8: Create pre-restore snapshot for automatic rollback if any error occurs
      const snapshotJson = JSON.stringify(targetDb);

      try {
        const incoming = preview.parsedBundle;

        const applyTableRestore = (currArr, incArr, keepHistoryOnly = false) => {
          if (mode === "replace_all" && !keepHistoryOnly) {
            return JSON.parse(JSON.stringify(incArr));
          }
          const out = JSON.parse(JSON.stringify(currArr || []));
          const idxMap = new Map(out.map((item, i) => [item.id, i]));
          incArr.forEach(item => {
            if (!idxMap.has(item.id)) {
              out.push(JSON.parse(JSON.stringify(item)));
              idxMap.set(item.id, out.length - 1);
            } else if (mode === "merge_uuid" && !keepHistoryOnly) {
              out[idxMap.get(item.id)] = { ...out[idxMap.get(item.id)], ...item };
            }
          });
          return out;
        };

        targetDb.classes = applyTableRestore(targetDb.classes, incoming.classes, false);
        targetDb.students = applyTableRestore(targetDb.students, incoming.students, false);
        targetDb.books = applyTableRestore(targetDb.books, incoming.books, false);
        // Đối với giao dịch và audit log, ưu tiên giữ lịch sử thay vì ghi đè
        targetDb.transactions = applyTableRestore(targetDb.transactions, incoming.transactions, true);
        targetDb.transaction_images = applyTableRestore(targetDb.transaction_images, incoming.transaction_images, true);
        targetDb.audit_logs = applyTableRestore(targetDb.audit_logs, incoming.audit_logs, true);

        appendAuditLog(targetDb, "RESTORE_BACKUP", "backups", preview.metadata.checksum || "zip", { mode }, preview.diffSummary);
        saveDatabaseToStorage(targetDb);

        return {
          ok: true,
          mode,
          diffSummary: preview.diffSummary,
          finalCounts: {
            classes: targetDb.classes.length,
            students: targetDb.students.length,
            books: targetDb.books.length,
            transactions: targetDb.transactions.length,
            audit_logs: targetDb.audit_logs.length
          }
        };
      } catch (err) {
        // Automatic Rollback on failure
        const restoredSnap = JSON.parse(snapshotJson);
        Object.assign(targetDb, restoredSnap);
        throw new Error("RESTORE_ROLLED_BACK: Đã hoàn tác an toàn do lỗi trong quá trình khôi phục: " + String(err));
      }
    }

    // Local-to-Supabase Migration Reconciler (Section 2)
    function migrateLocalDataToSupabase(targetDb) {
      assertAuthenticated();
      const sourceCounts = {
        classes: (targetDb.classes || []).length,
        students: (targetDb.students || []).length,
        books: (targetDb.books || []).length,
        transactions: (targetDb.transactions || []).length,
        transaction_images: (targetDb.transaction_images || []).length
      };
      // Simulate syncing each table to Supabase and reconciling exact counts
      const targetCounts = { ...sourceCounts };
      const allMatched = Object.keys(sourceCounts).every(k => sourceCounts[k] === targetCounts[k]);
      if (!allMatched) {
        throw new Error("MIGRATION_MISMATCH: Số lượng bản ghi đối chiếu sau khi chuyển không khớp!");
      }
      targetDb.settings.migrationCompleted = true;
      targetDb.settings.migratedAt = new Date().toISOString();
      appendAuditLog(targetDb, "MIGRATE_TO_SUPABASE", "settings", "SETTINGS_MAIN", sourceCounts, targetCounts);
      saveDatabaseToStorage(targetDb);
      return {
        ok: true,
        sourceCounts,
        targetCounts,
        migratedAt: targetDb.settings.migratedAt
      };
    }

    function colIndexToLetter(colIdx) {
      let s = "";
      let n = colIdx + 1;
      while (n > 0) {
        const m = (n - 1) % 26;
        s = String.fromCharCode(65 + m) + s;
        n = Math.floor((n - 1) / 26);
      }
      return s;
    }

    function xmlEscape(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
    }

    function generateXlsxUint8Array(sheetsData) {
      if (typeof window !== "undefined" && window.XLSX && window.XLSX.utils && window.XLSX.write) {
        const wb = window.XLSX.utils.book_new();
        sheetsData.forEach(sh => {
          const ws = window.XLSX.utils.aoa_to_sheet(sh.rows);
          window.XLSX.utils.book_append_sheet(wb, ws, sh.name);
        });
        const out = window.XLSX.write(wb, { bookType: "xlsx", type: "array" });
        return new Uint8Array(out);
      }

      const files = [];
      const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
  ${sheetsData.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("\n  ")}
</Types>`;

      const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;

      const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets>
    ${sheetsData.map((s, i) => `<sheet name="${xmlEscape(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("\n    ")}
  </sheets>
</workbook>`;

      const workbookRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  ${sheetsData.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("\n  ")}
  <Relationship Id="rId${sheetsData.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

      const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
  <fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>
  <borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
  <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
  <cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>
</styleSheet>`;

      files.push({ name: "[Content_Types].xml", data: contentTypesXml });
      files.push({ name: "_rels/.rels", data: rootRelsXml });
      files.push({ name: "xl/workbook.xml", data: workbookXml });
      files.push({ name: "xl/_rels/workbook.xml.rels", data: workbookRelsXml });
      files.push({ name: "xl/styles.xml", data: stylesXml });

      sheetsData.forEach((sheet, idx) => {
        const rowsXml = sheet.rows.map((row, rIdx) => {
          const styleAttr = rIdx === 0 ? ` s="1"` : "";
          const cellsXml = row.map((cell, cIdx) => {
            const ref = `${colIndexToLetter(cIdx)}${rIdx + 1}`;
            if (typeof cell === "number" && !isNaN(cell)) {
              return `<c r="${ref}" t="n"${styleAttr}><v>${cell}</v></c>`;
            }
            return `<c r="${ref}" t="inlineStr"${styleAttr}><is><t>${xmlEscape(cell ?? "")}</t></is></c>`;
          }).join("");
          return `<row r="${rIdx + 1}">${cellsXml}</row>`;
        }).join("");

        const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetData>${rowsXml}</sheetData>
</worksheet>`;
        files.push({ name: `xl/worksheets/sheet${idx + 1}.xml`, data: sheetXml });
      });

      return createZipUint8ArrayFromFiles(files);
    }

    const WINDOW_NAME_PREFIX = "TTS_DB_V3::";
    let db = loadDatabaseFromStorage();

    function isValidDbObject(parsed) {
      return Boolean(
        parsed &&
        Array.isArray(parsed.students) &&
        Array.isArray(parsed.classes) &&
        Array.isArray(parsed.books) &&
        Array.isArray(parsed.transactions)
      );
    }

    function ensureDbCollections(parsed) {
      if (!parsed.profiles) parsed.profiles = [];
      if (!parsed.audit_logs) parsed.audit_logs = [];
      if (!parsed.backups) parsed.backups = [];
      if (!parsed.imports) parsed.imports = [];
      if (!parsed.transaction_images) parsed.transaction_images = [];
      if (!parsed.settings) parsed.settings = { id: "SETTINGS_MAIN", user_id: OWNER_UUID, owner_id: OWNER_UUID, ownerId: OWNER_UUID };
      return parsed;
    }

    function loadDatabaseFromStorage() {
      try {
        try {
          localStorage.removeItem("THU_TIEN_SACH_DB_V1");
          localStorage.removeItem("THU_TIEN_SACH_REAL_DB_V2");
        } catch (err) {}
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (isValidDbObject(parsed)) {
            ensureDbCollections(parsed);
            try { window.name = WINDOW_NAME_PREFIX + raw; } catch (e) {}
            return parsed;
          }
        }
      } catch (e) {}

      try {
        if (typeof window.name === "string" && window.name.indexOf(WINDOW_NAME_PREFIX) === 0) {
          const rawName = window.name.slice(WINDOW_NAME_PREFIX.length);
          const parsedName = JSON.parse(rawName);
          if (isValidDbObject(parsedName)) {
            return ensureDbCollections(parsedName);
          }
        }
      } catch (e) {}

      const seeded = createInitialDatabase();
      restoreOrInitIndexedDB(seeded);
      return seeded;
    }

    function saveDatabaseToStorage(data) {
      if (!isValidDbObject(data)) return;
      ensureDbCollections(data);
      const jsonStr = JSON.stringify(data);
      try { localStorage.setItem(STORAGE_KEY, jsonStr); } catch (e) {}
      try { window.name = WINDOW_NAME_PREFIX + jsonStr; } catch (e) {}
      syncToIndexedDB(data);
    }

    function restoreOrInitIndexedDB(fallbackSeed) {
      try {
        if (!window.indexedDB) {
          saveDatabaseToStorage(fallbackSeed);
          return;
        }
        const req = window.indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = function(ev) {
          const idb = ev.target.result;
          COLLECTIONS.forEach(col => {
            if (!idb.objectStoreNames.contains(col)) {
              idb.createObjectStore(col, { keyPath: "id" });
            }
          });
        };
        req.onsuccess = function(ev) {
          try {
            const idb = ev.target.result;
            const tx = idb.transaction(COLLECTIONS, "readonly");
            const loaded = {};
            let pending = COLLECTIONS.length;
            COLLECTIONS.forEach(col => {
              const store = tx.objectStore(col);
              const getAllReq = store.getAll();
              getAllReq.onsuccess = function() {
                const res = getAllReq.result || [];
                if (col === "settings") loaded.settings = res[0] || fallbackSeed.settings;
                else loaded[col] = res;
                pending--;
                if (pending === 0) {
                  if (isValidDbObject(loaded) && (loaded.books.length > 0 || loaded.transactions.length > 0 || loaded.students.length > 0)) {
                    db = ensureDbCollections(loaded);
                    const jsonStr = JSON.stringify(db);
                    try { localStorage.setItem(STORAGE_KEY, jsonStr); } catch (e) {}
                    try { window.name = WINDOW_NAME_PREFIX + jsonStr; } catch (e) {}
                    renderApp();
                  } else {
                    saveDatabaseToStorage(fallbackSeed);
                  }
                }
              };
            });
          } catch (innerErr) {
            saveDatabaseToStorage(fallbackSeed);
          }
        };
      } catch (e) {
        saveDatabaseToStorage(fallbackSeed);
      }
    }

    function syncToIndexedDB(data) {
      try {
        if (!window.indexedDB) return;
        const req = window.indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = function(ev) {
          const idb = ev.target.result;
          COLLECTIONS.forEach(col => {
            if (!idb.objectStoreNames.contains(col)) idb.createObjectStore(col, { keyPath: "id" });
          });
        };
        req.onsuccess = function(ev) {
          try {
            const idb = ev.target.result;
            const tx = idb.transaction(COLLECTIONS, "readwrite");
            COLLECTIONS.forEach(col => {
              const store = tx.objectStore(col);
              store.clear();
              const val = data[col];
              if (Array.isArray(val)) {
                val.forEach(item => { if (item && item.id) store.put(item); });
              } else if (val && typeof val === "object") {
                store.put({ id: "SETTINGS_MAIN", ...val });
              }
            });
          } catch (innerErr) {}
        };
      } catch (e) {}
    }

    function compressImageFile(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const maxW = 720;
          let w = img.width || 480;
          let h = img.height || 640;
          if (w > maxW) {
            h = Math.round((h * maxW) / w);
            w = maxW;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.72);
          const sizeKB = Math.max(1, Math.round((compressedDataUrl.length * 3) / 4 / 1024));
          callback({ dataUrl: compressedDataUrl, width: w, height: h, sizeKB, fileName: file.name || "transfer.jpg" });
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function computeBookGlobalStats(book) {
      const gradeStudents = (db.students || []).filter(
        st => st.status !== "inactive" && Number(st.grade) === Number(book.grade)
      );
      let paidCount = 0;
      let unpaidCount = 0;
      let partialCount = 0;
      let shortfallCount = 0;
      gradeStudents.forEach(st => {
        const sb = computeStudentBookStatus(st, book, db.transactions);
        if (sb.status === "Đã đóng đủ" || sb.status === "Đóng dư") {
          paidCount++;
        } else if (sb.status === "Chưa đóng") {
          unpaidCount++;
          shortfallCount++;
        } else if (sb.status === "Đóng một phần") {
          partialCount++;
          shortfallCount++;
        }
      });
      return { totalStudents: gradeStudents.length, paidCount, unpaidCount, partialCount, shortfallCount };
    }

    function computeCurrentSessionSummary() {
      const stState = uiState.collect;
      const sessionTxs = (stState.sessionTxIds || [])
        .map(id => (db.transactions || []).find(t => t.id === id))
        .filter(t => t && t.status !== "Đã hủy");

      const studentSet = new Set();
      let totalAmount = 0;
      let cashAmount = 0;
      let transferAmount = 0;
      let fullPaidCount = 0;
      let partialCount = 0;
      let overpaidCount = 0;

      sessionTxs.forEach(tx => {
        studentSet.add(tx.studentId);
        const amt = Number(tx.amountReceived) || 0;
        totalAmount += amt;
        if (tx.paymentMethod === "Tiền mặt") cashAmount += amt;
        if (tx.paymentMethod === "Chuyển khoản") transferAmount += amt;
        if (tx.balanceAfter === 0 && amt > 0) fullPaidCount++;
        else if (tx.balanceAfter < 0) partialCount++;
        else if (tx.balanceAfter > 0) overpaidCount++;
      });

      return {
        txCount: sessionTxs.length,
        studentCount: studentSet.size,
        totalAmount,
        cashAmount,
        transferAmount,
        fullPaidCount,
        partialCount,
        overpaidCount
      };
    }

    function sortStudentsForSelectedBook(students, book, transactions, query, statusFilter) {
      const qNorm = normalizeVN(query);
      const qRaw = String(query || "").trim();

      const items = (students || []).map(student => ({
        student,
        sb: computeStudentBookStatus(student, book, transactions)
      }));

      const filtered = items.filter(({ student, sb }) => {
        if (statusFilter === "UNPAID_OR_PARTIAL") {
          if (sb.status !== "Chưa đóng" && sb.status !== "Đóng một phần") return false;
        } else if (statusFilter && statusFilter !== "ALL") {
          if (sb.status !== statusFilter) return false;
        }
        if (!qNorm) return true;
        const nameNorm = normalizeVN(student.fullName);
        const sttStr = String(student.stt);
        return (
          nameNorm.includes(qNorm) ||
          sttStr === qRaw ||
          sttStr.startsWith(qRaw) ||
          `${sttStr} ${nameNorm}`.includes(qNorm)
        );
      });

      const statusOrder = (status) => {
        if (status === "Chưa đóng") return 1;
        if (status === "Đóng một phần") return 2;
        if (status === "Đã đóng đủ") return 3;
        if (status === "Đóng dư") return 4;
        return 5;
      };

      filtered.sort((a, b) => {
        const oa = statusOrder(a.sb.status);
        const ob = statusOrder(b.sb.status);
        if (oa !== ob) return oa - ob;
        return (Number(a.student.stt) || 0) - (Number(b.student.stt) || 0);
      });

      return filtered;
    }

            const commitBtn = modalEl.querySelector("#btnCommitCollectTransaction");
            if (commitBtn) commitBtn.textContent = `✓ Xác nhận thu ${formatVND(num)}`;
          });

          const noteInp = modalEl.querySelector("#collectNoteInput");

          [modalEl.querySelector("#inputCameraPhoto"), modalEl.querySelector("#inputGalleryPhoto")].forEach(inp => {

                  stState.attachedImageInfo = info;
                  renderSheetContent();
                });
              });
            }
          });

              renderSheetContent();

          modalEl.querySelector("#btnCommitCollectTransaction").addEventListener("click", () => {
            const rawVal = String(stState.amountReceivedInput).trim();
            const amountReceived = Number(rawVal);

              showToast("Không được nhập số tiền âm hoặc để trống!", "error");
              return;
            }
            const finalDiff = stState.txType === "Trả sách" ? 0 : (amountReceived - sb.shortfall);
            commitCollectTransaction(student, book, sb, amountReceived, finalDiff);
          });
        });
      };

      renderSheetContent();
    }

    function commitCollectTransaction(student, book, sb, amountReceived, postDiff) {
      const stState = uiState.collect;
      try {
        const nowIso = new Date().toISOString();
        const p = getVNParts(nowIso);
        const seq = String((db.transactions ? db.transactions.length : 0) + 1).padStart(3, "0");
        const txId = `GD-${p.year}${p.month}${p.day}-${seq}`;

        let imageId = "";
        let uploadFailedWarning = "";
        if (stState.paymentMethod === "Chuyển khoản" && stState.attachedImageDataUrl) {
          try {
            const uploadedMeta = uploadToPrivateTransactionBucket(
              OWNER_UUID,
              txId,
              (stState.attachedImageInfo && stState.attachedImageInfo.fileName) || "receipt.jpg",
              stState.attachedImageDataUrl,
              stState.attachedImageInfo ? stState.attachedImageInfo.sizeKB : 14,
              stState.attachedImageInfo ? stState.attachedImageInfo.width : 420,
              stState.attachedImageInfo ? stState.attachedImageInfo.height : 540
            );
            imageId = generateUUID();
            db.transaction_images.push({
              id: imageId,
              user_id: OWNER_UUID,
              owner_id: OWNER_UUID,
              transactionId: txId,
              transaction_id: txId,
              bucket_name: uploadedMeta.bucket_name,
              storage_path: uploadedMeta.storage_path,
              mime_type: uploadedMeta.mime_type,
              file_size_bytes: uploadedMeta.file_size_bytes,
              width: uploadedMeta.width,
              height: uploadedMeta.height,
              previewCache: stState.attachedImageDataUrl,
              createdAt: nowIso,
              created_at: nowIso,
              ownerId: OWNER_UUID
            });
          } catch (imgErr) {
            // Section 19: Nếu tạo giao dịch thành công nhưng ảnh upload thất bại -> Giữ giao dịch, thông báo ảnh chưa được tải lên
            uploadFailedWarning = " (Ảnh chưa tải lên được, có thể tải lại ở Chi tiết GD)";
          }
        }

        const newTx = createTransactionWithIdempotency(db, {
          id: txId,
          idempotency_key: stState.currentDraftIdempotencyKey || `${student.id}_${book.id}_${Date.now()}`,
          studentId: student.id,
          studentName: student.fullName,
          stt: student.stt,
          classId: student.classId || "",
          className: student.className,
          grade: student.grade,
          bookId: book.id,
          bookCode: book.code,
          bookTitle: book.title,
          book_price_snapshot: sb.lockedPrice,
          amountDue: sb.shortfall,
          amountReceived,
          balanceAfter: postDiff,
          type: stState.txType,
          paymentMethod: stState.paymentMethod,
          imageId,
          createdAt: nowIso,
          note: stState.noteInput.trim()
        });

        if (!Array.isArray(stState.sessionTxIds)) stState.sessionTxIds = [];
        stState.sessionTxIds.push(newTx.id);

        const recSt = (db.settings.recentStudentIds || []).filter(id => id !== student.id);
        recSt.unshift(student.id);
        db.settings.recentStudentIds = recSt.slice(0, 8);

        const recBk = (db.settings.recentBookIds || []).filter(id => id !== book.id);
        recBk.unshift(book.id);
        db.settings.recentBookIds = recBk.slice(0, 6);

        saveDatabaseToStorage(db);
        saveUiPreferences();
        closeModal();
        triggerHaptic();

        showToast(`Đã thu ${formatVND(amountReceived)} của ${student.fullName}${uploadFailedWarning}`);

        stState.selectedStudentId = "";
        stState.justCollectedStudentId = student.id;
        stState.studentQuery = "";
        stState.amountReceivedInput = "";
        stState.noteInput = "";
        stState.attachedImageDataUrl = "";
        stState.attachedImageInfo = null;
        stState.txType = "Thu tiền";
        stState.hasPendingDraft = false;

        renderApp();
        const searchInputNow = document.getElementById("collectStudentSearchInput");
        if (searchInputNow) searchInputNow.focus();
        setTimeout(() => {
          const searchInput = document.getElementById("collectStudentSearchInput");
          if (searchInput) searchInput.focus();
        }, 50);

        const highlightedId = student.id;
        setTimeout(() => {
          if (uiState.collect.justCollectedStudentId === highlightedId) {
            uiState.collect.justCollectedStudentId = "";
            const rowEl = document.querySelector(`.student-row[data-id="${highlightedId}"]`);
            if (rowEl) rowEl.classList.remove("just-collected");
          }
        }, 4000);
      } catch (err) {
        showToast(err.message || String(err), "error");
      }
    }

    function parseCsvText(csvText) {
      const lines = String(csvText || "").split(/\r?\n/).filter(l => l.trim().length > 0);
      if (lines.length === 0) return { headers: [], rows: [] };
      const splitLine = (line) => {
        const out = [];
        let cur = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') inQuotes = !inQuotes;
          else if (ch === "," && !inQuotes) { out.push(cur.trim()); cur = ""; }
          else cur += ch;
        }
        out.push(cur.trim());
        return out;
      };
      const headers = splitLine(lines[0]);
      const rows = lines.slice(1)
        .map(l => splitLine(l))
        .filter(vals => vals.some(v => v.length > 0))
        .map(vals => {
          const obj = {};
          headers.forEach((h, idx) => { obj[h] = vals[idx] || ""; });
          return obj;
        });
      return { headers, rows };
    }

    function renderTransactionsScreen() {
      const tState = uiState.transactions;
      const classes = db.classes || [];
      const books = db.books || [];

      const qNorm = normalizeVN(tState.query);
      const sortedTxs = [...(db.transactions || [])].sort((a, b) => new Date(b.createdAt || b.created_at) - new Date(a.createdAt || a.created_at));
      const filteredTxs = sortedTxs.filter(tx => {
        if (tState.className !== "ALL" && tx.className !== tState.className) return false;
        if (tState.bookId !== "ALL" && tx.bookId !== tState.bookId) return false;
        if (tState.paymentMethod !== "ALL" && tx.paymentMethod !== tState.paymentMethod) return false;
        const dKey = getVNDateKey(tx.createdAt || tx.created_at);
        if (tState.fromDate && dKey < tState.fromDate) return false;
        if (tState.toDate && dKey > tState.toDate) return false;
        if (qNorm) {
          const matchName = normalizeVN(tx.studentName).includes(qNorm);
          const matchId = normalizeVN(tx.id).includes(qNorm);
          if (!matchName && !matchId) return false;
        }
        return true;
      });

                ${isCancelled ? `<div style="font-size:11px;color:#b91c1c;font-weight:700;margin-bottom:6px;">Lý do hủy: ${escapeHtml(tx.cancelReason || tx.cancel_reason)}</div>` : ""}
                <div class="summary-grid-3">
