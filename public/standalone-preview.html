    function openTxDetailModal(txId) {
      const tx = db.transactions.find(t => t.id === txId);
      if (!tx) return;
      const imgObj = tx.imageId ? db.transaction_images.find(im => im.id === tx.imageId) : null;
      let signedInfo = null;
      let resolvedImgUrl = "";
      if (imgObj) {
        try {
          signedInfo = createSignedUrlForTransactionImage(imgObj, 3600);
          resolvedImgUrl = signedInfo.resolveDataUrl();
        } catch (e) {}
      }
      const snapPrice = tx.book_price_snapshot !== undefined ? tx.book_price_snapshot : tx.bookPriceAtTransaction;

      openModal(`
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h3 style="margin:0;font-size:17px;font-weight:800;">Chi tiết ${escapeHtml(tx.id)}</h3>
            <button type="button" class="btn-touch btn-secondary" style="min-height:48px;padding:6px 12px;" id="btnCloseTxDetail">Đóng</button>
          </div>
          <div style="background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:10px;font-size:13px;margin-bottom:12px;">
            <div style="padding:3px 0;"><strong>Học sinh:</strong> #${tx.stt} ${escapeHtml(tx.studentName)} (${escapeHtml(tx.className)})</div>
            <div style="padding:3px 0;"><strong>Sách:</strong> ${escapeHtml(tx.bookTitle)} (${escapeHtml(tx.bookCode)})</div>
            <div style="padding:3px 0;"><strong>Giá snapshot (book_price_snapshot):</strong> ${formatVND(snapPrice)}</div>
            <div style="padding:3px 0;"><strong>Số tiền thực nhận:</strong> <strong style="color:#0f766e;">${formatVND(tx.amountReceived)}</strong></div>
            <div style="padding:3px 0;"><strong>Loại & Phương thức:</strong> ${escapeHtml(tx.type)} • ${escapeHtml(tx.paymentMethod)}</div>
            <div style="padding:3px 0;"><strong>Trạng thái:</strong> ${escapeHtml(tx.status)}</div>
            <div style="padding:3px 0;"><strong>Idempotency Key:</strong> <code>${escapeHtml(tx.idempotency_key || "N/A")}</code></div>
            <div style="padding:3px 0;"><strong>Thời gian tạo:</strong> ${formatDateTimeVN(tx.createdAt || tx.created_at)}</div>
            ${tx.refTransactionId ? `<div style="padding:3px 0;"><strong>Giao dịch gốc:</strong> ${escapeHtml(tx.refTransactionId)}</div>` : ""}
            ${tx.note ? `<div style="padding:3px 0;"><strong>Ghi chú:</strong> ${escapeHtml(tx.note)}</div>` : ""}
            ${tx.cancelReason ? `<div style="padding:3px 0;color:#b91c1c;"><strong>Lý do hủy:</strong> ${escapeHtml(tx.cancelReason)}</div>` : ""}
          </div>

          ${imgObj ? `
            <div style="margin-bottom:12px;background:#f0fdfa;padding:10px;border-radius:12px;border:1px solid #99f6e4;">
              <div style="font-weight:700;font-size:12px;color:#0f766e;margin-bottom:4px;">
                🔒 Private Bucket (transaction-images): <code>${escapeHtml(imgObj.storage_path)}</code>
              </div>
              <div style="font-size:11px;color:#475569;margin-bottom:6px;">
                Signed URL có thời hạn (Hết hạn lúc ${formatDateTimeVN(new Date(signedInfo ? signedInfo.expiresAt : Date.now()).toISOString())})
              </div>
              ${resolvedImgUrl ? `<img src="${resolvedImgUrl}" alt="Ảnh chuyển khoản" style="max-width:100%;max-height:220px;border-radius:10px;display:block;margin:0 auto;">` : ""}
            </div>
          ` : ""}

          ${tx.paymentMethod === "Chuyển khoản" ? `
            <label class="btn-touch btn-outline-teal" style="width:100%;cursor:pointer;font-size:13px;">
              📷 ${imgObj ? "Tải lại / Thay ảnh chuyển khoản" : "Tải bổ sung ảnh chuyển khoản"}
              <input type="file" accept="image/*" id="inputReuploadTxImage" style="display:none;">
            </label>
          ` : ""}
        </div>
      `, (modalEl) => {
        modalEl.querySelector("#btnCloseTxDetail").addEventListener("click", closeModal);
        const reupInp = modalEl.querySelector("#inputReuploadTxImage");
        if (reupInp) {
          reupInp.addEventListener("change", (ev) => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            compressImageFile(file, (info) => {
              const up = uploadToPrivateTransactionBucket(OWNER_UUID, tx.id, info.fileName, info.dataUrl, info.sizeKB, info.width, info.height);
              const newImgId = generateUUID();
              db.transaction_images.push({
                id: newImgId,
                user_id: OWNER_UUID,
                owner_id: OWNER_UUID,
                transactionId: tx.id,
                transaction_id: tx.id,
                bucket_name: up.bucket_name,
                storage_path: up.storage_path,
                mime_type: up.mime_type,
                file_size_bytes: up.file_size_bytes,
                width: up.width,
                height: up.height,
                previewCache: info.dataUrl,
                createdAt: new Date().toISOString(),
                created_at: new Date().toISOString()
              });
              tx.imageId = newImgId;
              saveDatabaseToStorage(db);
              showToast("Đã tải ảnh lên private bucket transaction-images!");
              openTxDetailModal(tx.id);
            });
          });
        }
      });
    }

    function openCancelTxModal(txId) {
      const tx = db.transactions.find(t => t.id === txId);
      if (!tx || tx.status === "Đã hủy") return;

      openModal(`
        <div>
          <h3 style="margin:0 0 8px 0;font-size:17px;font-weight:800;color:#b91c1c;">Hủy giao dịch ${escapeHtml(tx.id)}</h3>
          <p style="margin:0 0 10px 0;font-size:12px;color:#475569;">
            Không xóa vĩnh viễn giao dịch. Giao dịch chuyển thành “Đã hủy”, bắt buộc nhập lý do và không tính vào báo cáo.
          </p>
          <label for="cancelReasonInput" style="font-size:12px;font-weight:700;display:block;margin-bottom:6px;">Lý do hủy giao dịch *</label>
          <input type="text" id="cancelReasonInput" class="input-field" style="margin-bottom:12px;" placeholder="Nhập lý do hủy...">
          <div class="summary-grid-2">
            <button type="button" class="btn-touch btn-secondary" id="btnAbortCancelTx">Quay lại</button>
            <button type="button" class="btn-touch btn-danger" id="btnConfirmCancelTx">Xác nhận Hủy GD</button>
          </div>
        </div>
      `, (modalEl) => {
        modalEl.querySelector("#btnAbortCancelTx").addEventListener("click", closeModal);
        modalEl.querySelector("#btnConfirmCancelTx").addEventListener("click", () => {
          const reason = modalEl.querySelector("#cancelReasonInput").value.trim();
          if (!reason) {
            showToast("Vui lòng nhập lý do hủy giao dịch!", "error");
            return;
          }
          const oldSnap = { ...tx };
          tx.status = "Đã hủy";
          tx.cancelReason = reason;
          tx.cancel_reason = reason;
          tx.cancelled_at = new Date().toISOString();
          tx.updated_at = tx.cancelled_at;
          appendAuditLog(db, "CANCEL_TRANSACTION", "transactions", tx.id, oldSnap, tx);
          saveDatabaseToStorage(db);
          closeModal();
          triggerHaptic();
          showToast(`Đã hủy giao dịch ${tx.id} & ghi Audit Log`);
          renderApp();
        });
      });
    }

    function openRefundTxModal(txId) {
      const sourceTx = db.transactions.find(t => t.id === txId);
      if (!sourceTx || sourceTx.status === "Đã hủy") return;
      const student = db.students.find(s => s.id === sourceTx.studentId);
      const book = db.books.find(b => b.id === sourceTx.bookId);
      if (!student || !book) return;

      const sb = computeStudentBookStatus(student, book, db.transactions);
      const maxRefundable = sb.netReceived;
      if (maxRefundable <= 0) {
        showToast("Học sinh này không còn số tiền hợp lệ đã thu để hoàn tiền!", "error");
        return;
      }
      const defaultRefund = sb.overpaid > 0 ? sb.overpaid : maxRefundable;

      openModal(`
        <div>
          <h3 style="margin:0 0 8px 0;font-size:17px;font-weight:800;">Tạo giao dịch Hoàn tiền</h3>
          <div style="font-size:12px;color:#475569;margin-bottom:10px;">
            Giao dịch gốc: <strong>${escapeHtml(sourceTx.id)}</strong><br>
            Học sinh: <strong>${escapeHtml(student.fullName)} (${escapeHtml(student.className)})</strong><br>
            Tối đa được hoàn: <strong style="color:#0f766e;">${formatVND(maxRefundable)}</strong>
          </div>
          <div style="margin-bottom:8px;">
            <label style="font-size:12px;font-weight:700;">Số tiền hoàn lại *</label>
            <input type="number" id="refundAmountInput" class="input-field" min="1000" max="${maxRefundable}" step="1000" value="${defaultRefund}">
          </div>
          <div style="margin-bottom:8px;">
            <label style="font-size:12px;font-weight:700;">Phương thức</label>
            <select id="refundMethodSelect" class="input-field">
              <option value="Tiền mặt">Tiền mặt</option>
              <option value="Chuyển khoản">Chuyển khoản</option>
            </select>
          </div>
          <div style="margin-bottom:12px;">
            <label style="font-size:12px;font-weight:700;">Ghi chú *</label>
            <input type="text" id="refundNoteInput" class="input-field" value="Hoàn tiền từ GD ${escapeHtml(sourceTx.id)}">
          </div>
          <div class="summary-grid-2">
            <button type="button" class="btn-touch btn-secondary" id="btnCancelRefundModal">Hủy</button>
            <button type="button" class="btn-touch btn-primary" id="btnConfirmRefundModal">Lưu Hoàn tiền</button>
          </div>
        </div>
      `, (modalEl) => {
        modalEl.querySelector("#btnCancelRefundModal").addEventListener("click", closeModal);
        modalEl.querySelector("#btnConfirmRefundModal").addEventListener("click", () => {
          const amt = Number(modalEl.querySelector("#refundAmountInput").value);
          const method = modalEl.querySelector("#refundMethodSelect").value;
          const note = modalEl.querySelector("#refundNoteInput").value.trim();

          if (isNaN(amt) || amt <= 0) {
            showToast("Số tiền hoàn phải lớn hơn 0!", "error");
            return;
          }
          if (amt > maxRefundable) {
            showToast(`Không cho phép hoàn tiền vượt quá số tiền hợp lệ đã thu (${formatVND(maxRefundable)})!`, "error");
            return;
          }

          const refundTx = createTransactionWithIdempotency(db, {
            idempotency_key: `refund_${sourceTx.id}_${Date.now()}`,
            studentId: student.id,
            studentName: student.fullName,
            stt: student.stt,
            classId: student.classId || "",
            className: student.className,
            grade: student.grade,
            bookId: book.id,
            bookCode: book.code,
            bookTitle: book.title,
            book_price_snapshot: sb.lockedPrice,
            amountDue: 0,
            amountReceived: amt,
            balanceAfter: (sb.netReceived - amt) - sb.effectiveDue,
            type: "Hoàn tiền",
            paymentMethod: method,
            note: note || `Hoàn tiền tham chiếu ${sourceTx.id}`,
            refTransactionId: sourceTx.id
          });

          saveDatabaseToStorage(db);
          closeModal();
          triggerHaptic();
          showToast(`Đã tạo hoàn tiền ${refundTx.id}: ${formatVND(amt)}`);
          renderApp();
        });
      });
    }

        modalEl.querySelector("#btnSaveEditBook").addEventListener("click", () => {
          const code = modalEl.querySelector("#editBkCode").value.trim().toUpperCase();
          const grade = parseInt(modalEl.querySelector("#editBkGrade").value, 10);
          const title = modalEl.querySelector("#editBkTitle").value.trim();
          const price = Number(modalEl.querySelector("#editBkPrice").value);
          const status = modalEl.querySelector("#editBkStatus").value;
          const note = modalEl.querySelector("#editBkNote").value.trim();

          if (!code || !title || isNaN(price) || price < 0 || (grade !== 10 && grade !== 11)) {
            showToast("Vui lòng nhập đầy đủ mã sách, tên sách và giá hợp lệ!", "error");
            return;
          }

          if (isEdit) {
            const oldSnap = { ...book };
            Object.assign(book, { code, grade, title, price, status, note, updated_at: new Date().toISOString() });
            appendAuditLog(db, "UPDATE_BOOK_PRICE", "books", book.id, oldSnap, book);
          } else {
            const newBook = {
              id: generateUUID(),
              user_id: OWNER_UUID,
              owner_id: OWNER_UUID,
              code, grade, title, price, status, note,
              ownerId: OWNER_UUID,
              created_at: new Date().toISOString(),
              updated_at: new Date().toISOString()
            };
            db.books.push(newBook);
            appendAuditLog(db, "CREATE_BOOK", "books", newBook.id, null, newBook);
            if (uiState.activeTab === "collect") {
              uiState.collect.selectedBookId = newBook.id;
              uiState.collect.showClassPicker = true;
            }
          }
          saveDatabaseToStorage(db);
          closeModal();
          showToast(isEdit ? "Đã cập nhật giá sách & ghi Audit Log!" : "Đã thêm sách mới & ghi Audit Log!");
          renderApp();
        });
      });
    }

    function openRestoreBackupModal() {
      let currentZipBytes = null;

              <option value="merge_uuid">2. Gộp và cập nhật theo UUID (Giữ lịch sử GD & Audit)</option>
              <option value="replace_all">3. Khôi phục toàn bộ</option>

          <div class="summary-grid-2" style="margin-bottom:10px;">
            <label class="btn-touch btn-outline-teal" style="cursor:pointer;font-size:12px;">

        </div>
      `, (modalEl) => {
        modalEl.querySelector("#btnCloseRestoreModal").addEventListener("click", closeModal);
        const modeSel = modalEl.querySelector("#restoreModeSelect");

        const renderZipPreview = () => {
          if (!currentZipBytes) return;
          const previewEl = modalEl.querySelector("#restorePreviewBox");
          try {
            selectedMode = modeSel.value;
            const check = validateAndPreviewBackupZip(currentZipBytes, db, selectedMode);
            const ds = check.diffSummary;
            previewEl.innerHTML = `
              <div style="background:#f8fafc;border:1.5px solid #86efac;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;">
                <div style="font-weight:800;color:#14532d;margin-bottom:4px;">
                  ✓ Kiểm tra gói ZIP hợp lệ (Schema v${escapeHtml(check.metadata.schema_version)} • Checksum: ${escapeHtml(check.metadata.checksum)})
                </div>
                <div>• Lớp học: +${ds.classes.add} thêm / ${ds.classes.update} cập nhật / ${ds.classes.skip} giữ nguyên</div>
                <div>• Học sinh: +${ds.students.add} thêm / ${ds.students.update} cập nhật / ${ds.students.skip} giữ nguyên</div>
                <div>• Sách: +${ds.books.add} thêm / ${ds.books.update} cập nhật / ${ds.books.skip} giữ nguyên</div>
                <div>• Giao dịch: +${ds.transactions.add} thêm / ${ds.transactions.skip} giữ lịch sử</div>
                <div style="margin-top:8px;">
                  <label style="font-size:11px;font-weight:700;color:#b91c1c;display:block;margin-bottom:4px;">
                    Nhập chính xác "XAC NHAN KHOI PHUC" để bắt đầu:
                  </label>
                  <input type="text" id="inputConfirmRestorePhrase" class="input-field" style="margin-bottom:8px;font-weight:800;" placeholder="XAC NHAN KHOI PHUC">
                  <button type="button" class="btn-touch btn-primary" style="width:100%;" id="btnExecuteZipRestore">
                    ✓ Thực hiện khôi phục an toàn (Có Rollback)
                  </button>
                </div>
              </div>
            `;
            previewEl.querySelector("#btnExecuteZipRestore").addEventListener("click", () => {
              const phrase = previewEl.querySelector("#inputConfirmRestorePhrase").value;
              try {
                const res = executeRestoreFromBackupZip(currentZipBytes, db, selectedMode, phrase);
                closeModal();
                triggerHaptic();
                showToast(`Khôi phục thành công (${res.finalCounts.students} HS, ${res.finalCounts.classes} lớp)!`);
                renderApp();
              } catch (err) {
                showToast(err.message || String(err), "error");
              }
            });
          } catch (err) {
            previewEl.innerHTML = `
              <div style="padding:10px;border-radius:10px;background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b;font-size:12px;font-weight:700;">
                ✕ Phát hiện file sao lưu lỗi: ${escapeHtml(err.message || String(err))}
              </div>
            `;
          }
        };

        modeSel.addEventListener("change", renderZipPreview);

        modalEl.querySelector("#inputRestoreJsonFile").addEventListener("change", (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            currentZipBytes = new Uint8Array(e.target.result);
            renderZipPreview();
          };
          reader.readAsArrayBuffer(file);
        });

        modalEl.querySelector("#btnParsePastedRestoreJson").addEventListener("click", () => {
          const latestBundle = createBackupZipBundle(db);
          currentZipBytes = latestBundle.zipBytes;
          renderZipPreview();
        });
      });
    }

            <div style="display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:4px;">
              <span>${escapeHtml(c.className)} (K${c.grade} • ${c.studentCount} HS)</span>
              <span style="color:#0f766e;">Đã thu: ${formatVND(c.totalCollected)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#475569;">
              <span>Phải thu: ${formatVND(c.totalDue)}</span>
              <span style="color:#b91c1c;font-weight:700;">Thiếu: ${formatVND(c.totalShortfall)}</span>
              <span>Dư: ${formatVND(c.totalOverpaid)}</span>
            </div>
          </div>
        `).join("");
      }
      if (subView === "byBook") {
        if (rep.byBook.length === 0) return `<div style="color:#64748b;font-size:13px;">Chưa có sách nào.</div>`;
        return rep.byBook.map(b => `
          <div style="padding:10px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;background:#f8fafc;">
            <div style="font-weight:800;font-size:14px;color:#0f172a;">${escapeHtml(b.bookTitle)} (${escapeHtml(b.bookCode)})</div>
            <div style="font-size:11px;color:#475569;margin:4px 0;">Khối ${b.grade} • Giá: ${formatVND(b.currentPrice)} • Đã đóng: ${b.paidCount}/${b.studentCount} HS</div>
            <div style="display:flex;justify-content:space-between;font-size:12px;">
              <span style="color:#0f766e;font-weight:700;">Đã thu: ${formatVND(b.totalCollected)}</span>
              <span style="color:#b91c1c;font-weight:700;">Thiếu: ${formatVND(b.totalShortfall)}</span>
            </div>
          </div>
        `).join("");
      }
      if (subView === "byDate") {
        if (rep.byDate.length === 0) return `<div style="color:#64748b;font-size:13px;">Chưa có giao dịch trong khoảng ngày này.</div>`;
        return rep.byDate.map(d => `
          <div style="padding:10px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;background:#f8fafc;">
            <div style="display:flex;justify-content:space-between;font-weight:800;font-size:13px;">
              <span>Ngày ${escapeHtml(d.date)} (${d.txCount} GD)</span>
              <span style="color:#0f766e;">Thực thu: ${formatVND(d.netCollected)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#475569;margin-top:4px;">
              <span>TM: ${formatVND(d.cashAmount)}</span>
              <span>CK: ${formatVND(d.transferAmount)}</span>
              <span>Hoàn: ${formatVND(d.refundAmount)}</span>
            </div>
          </div>
        `).join("");
      }

      const listMap = {
        paidList: rep.paidList,
        unpaidList: rep.unpaidList,
        shortfallList: rep.shortfallList,
        overpaidList: rep.overpaidList
      };
      const rows = listMap[subView] || [];
      if (rows.length === 0) return `<div style="color:#64748b;font-size:13px;">Danh sách trống.</div>`;

      return `<div style="max-height:320px;overflow-y:auto;">` + rows.slice(0, 60).map(r => `
        <div style="padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:6px;font-size:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>#${r.stt} ${escapeHtml(r.fullName)} (${escapeHtml(r.className)})</strong>
            ${getStatusBadgeHtml(r.status)}
          </div>
          <div style="color:#475569;font-size:11px;margin-top:2px;">${escapeHtml(r.bookTitle)}</div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px;">
            <span>Phải thu: ${formatVND(r.effectiveDue)}</span>
            <span style="color:#0f766e;">Đã đóng: ${formatVND(r.netReceived)}</span>
            <span style="color:${r.overpaid > 0 ? "#6d28d9" : "#b91c1c"};font-weight:700;">
              ${r.overpaid > 0 ? `Dư: +${formatVND(r.overpaid)}` : `Thiếu: ${formatVND(r.shortfall)}`}
            </span>
          </div>
        </div>
      `).join("") + `</div>`;
    }

    function triggerExcelDownload() {
      saveDatabaseToStorage(db);
      const sheets = buildExcelSheetsData(db, uiState.reports);
      const bytes = generateXlsxUint8Array(sheets);
      const fileName = getExcelFileName(new Date().toISOString());
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const dataUri = "data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64," + btoa(binary);
      const a = document.createElement("a");
      a.href = dataUri;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      triggerHaptic();
      showToast(`Đã xuất file Excel: ${fileName} (9 sheets)`);
    }

    function openPwaGuideModal() {
      openModal(`
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h3 style="margin:0;font-size:17px;font-weight:800;">Thêm vào Màn hình chính iPhone</h3>
            <button type="button" class="btn-touch btn-secondary" style="min-height:48px;padding:6px 12px;" id="btnClosePwaModal">Đóng</button>
          </div>
          <div style="font-size:13px;color:#334155;line-height:1.5;">
            <div style="background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:12px;margin-bottom:10px;">
              <div style="margin-bottom:6px;"><strong>1.</strong> Mở URL Production của ứng dụng bằng <strong>Safari</strong> trên iPhone.</div>
              <div style="margin-bottom:6px;"><strong>2.</strong> Chạm nút <strong>Chia sẻ (Share ⬆️)</strong> ở thanh dưới cùng Safari.</div>
              <div style="margin-bottom:6px;"><strong>3.</strong> Chọn <strong>“Thêm vào Màn hình chính” (Add to Home Screen)</strong>.</div>
              <div><strong>4.</strong> Chạm <strong>“Thêm” (Add)</strong> để sử dụng toàn màn hình standalone.</div>
            </div>
          </div>
        </div>
      `, (modalEl) => {
        modalEl.querySelector("#btnClosePwaModal").addEventListener("click", closeModal);
      });
    }

    function openTestSuiteModal() {
      const results = runAutomatedTests();
      const passedCount = results.filter(r => r.passed).length;

      openModal(`
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h3 style="margin:0;font-size:16px;font-weight:800;">Kiểm thử Bắt buộc (${passedCount}/${results.length} Đạt)</h3>
            <button type="button" class="btn-touch btn-secondary" style="min-height:48px;padding:6px 12px;" id="btnCloseTestModal">Đóng</button>
          </div>
          <div style="font-size:11px;color:#0f766e;background:#f0fdfa;padding:8px;border-radius:10px;margin-bottom:10px;font-weight:700;">
            ✓ Đã kiểm tra toàn bộ 25 kịch bản bắt buộc (Thu liên tiếp 20 HS, Idempotency chống bấm 2 lần, Snapshot giá, Excel 9 sheets, Backup/Restore ZIP, Corrupt ZIP, Auth & Signed URL hết hạn).
          </div>
          <div style="max-height:360px;overflow-y:auto;">
            ${results.map(r => `
              <div style="padding:8px 10px;border-radius:10px;border:1.5px solid ${r.passed ? "#86efac" : "#fca5a5"};background:${r.passed ? "#f0fdf4" : "#fef2f2"};margin-bottom:6px;font-size:12px;">
                <div style="font-weight:800;color:${r.passed ? "#14532d" : "#7f1d1d"};">
                  ${r.passed ? "✓ PASS" : "✕ FAIL"} — ${escapeHtml(r.name)}
                </div>
                <div style="font-size:11px;color:#334155;margin-top:2px;">${escapeHtml(r.detail)}</div>
              </div>
            `).join("")}
          </div>
        </div>
      `, (modalEl) => {
        modalEl.querySelector("#btnCloseTestModal").addEventListener("click", closeModal);
      });
    }

    // =========================================================================
    // 16. MAIN RENDER & EVENT WIRING
    // =========================================================================
    function renderApp() {
      const mainEl = document.getElementById("mainScreenContent");
      const bottomNav = document.getElementById("bottomNavBar");
      if (!mainEl) return;

      // If unauthenticated, block all screens and show Login Gate (Section 16)
      if (!authSession || !authSession.isAuthenticated) {
        if (bottomNav) bottomNav.classList.add("hidden");
        mainEl.innerHTML = renderAuthGateScreen();
        wireAuthGateEvents(mainEl);
        return;
      }

      if (bottomNav) bottomNav.classList.remove("hidden");
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === uiState.activeTab);
      });

      if (uiState.activeTab === "collect") {
        mainEl.innerHTML = renderCollectScreen();
        wireCollectScreenEvents(mainEl);
      } else if (uiState.activeTab === "students") {
        mainEl.innerHTML = renderStudentsScreen();
        wireStudentsScreenEvents(mainEl);
      } else if (uiState.activeTab === "transactions") {
        mainEl.innerHTML = renderTransactionsScreen();
        wireTransactionsScreenEvents(mainEl);
      } else if (uiState.activeTab === "books") {
        mainEl.innerHTML = renderBooksScreen();
        wireBooksScreenEvents(mainEl);
      } else if (uiState.activeTab === "reports") {
        mainEl.innerHTML = renderReportsScreen();
        wireReportsScreenEvents(mainEl);
      }
    }

    function wireCollectScreenEvents(container) {
      const bookSearchInput = container.querySelector("#collectBookSearchInput");
      if (bookSearchInput) {
        bookSearchInput.addEventListener("input", (e) => {
          uiState.collect.bookQuery = e.target.value;
          const pos = e.target.selectionStart;
          renderApp();
          const next = document.getElementById("collectBookSearchInput");
          if (next) { next.focus(); try { next.setSelectionRange(pos, pos); } catch (err) {} }
        });
      }
      const btnQuickCreateBk = container.querySelector("#btnQuickCreateBookOnCollect");
      if (btnQuickCreateBk) btnQuickCreateBk.addEventListener("click", () => openEditBookModal(null));
      const btnChangeBook = container.querySelector("#btnSessionChangeBook");
      if (btnChangeBook) btnChangeBook.addEventListener("click", handleChangeBookButtonClick);
      const btnChangeClass = container.querySelector("#btnSessionChangeClass");
      if (btnChangeClass) {
        btnChangeClass.addEventListener("click", () => {
          if (uiState.collect.hasPendingDraft) {
            handleChangeBookButtonClick();
            return;
          }
          uiState.collect.showClassPicker = true;
          renderApp();
        });
      }
      const btnEndSession = container.querySelector("#btnSessionEnd");
      if (btnEndSession) btnEndSession.addEventListener("click", openEndSessionModal);

      const searchInput = container.querySelector("#collectStudentSearchInput");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          uiState.collect.studentQuery = e.target.value;
          const pos = e.target.selectionStart;
          renderApp();
          const newSearch = document.getElementById("collectStudentSearchInput");
          if (newSearch) { newSearch.focus(); try { newSearch.setSelectionRange(pos, pos); } catch (err) {} }
        });
      }
    }

    function wireStudentsScreenEvents(container) {
      const searchInput = container.querySelector("#studentScreenSearchInput");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          uiState.students.query = e.target.value;
          const pos = e.target.selectionStart;
          renderApp();
          const next = document.getElementById("studentScreenSearchInput");
          if (next) { next.focus(); try { next.setSelectionRange(pos, pos); } catch (err) {} }
        });
      }
      const btnAdd = container.querySelector("#btnOpenAddStudentModal");
      if (btnAdd) btnAdd.addEventListener("click", () => openEditStudentModal(null));
      const btnCsv = container.querySelector("#btnOpenCsvImportModal");
      if (btnCsv) btnCsv.addEventListener("click", openCsvImportModal);
    }

    function wireTransactionsScreenEvents(container) {
      const searchInput = container.querySelector("#txSearchInput");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          uiState.transactions.query = e.target.value;
          const pos = e.target.selectionStart;
          renderApp();
          const next = document.getElementById("txSearchInput");
          if (next) { next.focus(); try { next.setSelectionRange(pos, pos); } catch (err) {} }
        });
      }
      const selClass = container.querySelector("#txFilterClass");
      if (selClass) selClass.addEventListener("change", (e) => { uiState.transactions.className = e.target.value; renderApp(); });
      const selBook = container.querySelector("#txFilterBook");
      if (selBook) selBook.addEventListener("change", (e) => { uiState.transactions.bookId = e.target.value; renderApp(); });
      const selMethod = container.querySelector("#txFilterMethod");
      if (selMethod) selMethod.addEventListener("change", (e) => { uiState.transactions.paymentMethod = e.target.value; renderApp(); });
      const fromD = container.querySelector("#txFilterFromDate");
      if (fromD) fromD.addEventListener("change", (e) => { uiState.transactions.fromDate = e.target.value; renderApp(); });
      const toD = container.querySelector("#txFilterToDate");
      if (toD) toD.addEventListener("change", (e) => { uiState.transactions.toDate = e.target.value; renderApp(); });
    }

    function wireBooksScreenEvents(container) {
      const btnAddBook = container.querySelector("#btnOpenAddBookModal");
      if (btnAddBook) btnAddBook.addEventListener("click", () => openEditBookModal(null));
      const btnBackup = container.querySelector("#btnExportBackupJson");
      if (btnBackup) btnBackup.addEventListener("click", openSettingsAndBackupModal);
      const btnRestore = container.querySelector("#btnOpenRestoreBackupModal");
      if (btnRestore) btnRestore.addEventListener("click", openRestoreBackupModal);
    }

    function wireReportsScreenEvents(container) {
      const btnExcel = container.querySelector("#btnExportExcelWorkbook");
      if (btnExcel) btnExcel.addEventListener("click", triggerExcelDownload);

      const bindSelect = (id, key) => {
        const el = container.querySelector(id);
        if (el) el.addEventListener("change", (e) => { uiState.reports[key] = e.target.value; renderApp(); });
      };
      bindSelect("#repFilterGrade", "grade");
      bindSelect("#repFilterClass", "className");
      bindSelect("#repFilterBook", "bookId");
      bindSelect("#repFilterStatus", "status");
      bindSelect("#repFilterMethod", "paymentMethod");
      bindSelect("#repFilterFromDate", "fromDate");
      bindSelect("#repFilterToDate", "toDate");
    }

    document.addEventListener("click", function(e) {
      const navBtn = e.target.closest(".nav-btn");
      if (navBtn && navBtn.dataset.tab) {
        uiState.activeTab = navBtn.dataset.tab;
        renderApp();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const actionBtn = e.target.closest("[data-action]");
      if (!actionBtn) return;
      const action = actionBtn.dataset.action;

      if (action === "filter-collect-book-grade") {
        uiState.collect.bookGradeFilter = actionBtn.dataset.grade;
        renderApp();
      } else if (action === "pick-collect-book") {
        const bkId = actionBtn.dataset.bookId;
        const bk = (db.books || []).find(b => b.id === bkId);
        if (!bk) return;
        uiState.collect.selectedBookId = bk.id;
        uiState.collect.selectedStudentId = "";
        uiState.collect.studentQuery = "";
        uiState.collect.sessionTxIds = [];
        if (!db.settings.recentBookIds) db.settings.recentBookIds = [];
        db.settings.recentBookIds = [bk.id, ...db.settings.recentBookIds.filter(id => id !== bk.id)].slice(0, 6);
        saveDatabaseToStorage(db);
        saveUiPreferences();
        const currentCls = (db.classes || []).find(c => c.name === uiState.collect.className);
        if (!currentCls || Number(currentCls.grade) !== Number(bk.grade)) {
          uiState.collect.className = "";
          uiState.collect.showClassPicker = true;
        } else {
          uiState.collect.showClassPicker = false;
        }
        renderApp();
      } else if (action === "select-collect-class") {
        uiState.collect.className = actionBtn.dataset.class;
        uiState.collect.showClassPicker = false;
        uiState.collect.selectedStudentId = "";
        uiState.collect.studentQuery = "";
        saveUiPreferences();
        renderApp();
      } else if (action === "set-collect-student-filter") {
        uiState.collect.studentStatusFilter = actionBtn.dataset.filter;
        renderApp();
      } else if (action === "tap-student-to-collect" || action === "pick-collect-student") {
        handleTapStudentForCollection(actionBtn.dataset.id);
      } else if (action === "set-payment-method") {
        uiState.collect.paymentMethod = actionBtn.dataset.method;
        if (uiState.collect.paymentMethod === "Tiền mặt") {
          uiState.collect.attachedImageDataUrl = "";
          uiState.collect.attachedImageInfo = null;
        }
        saveUiPreferences();
        renderApp();
      } else if (action === "select-students-class") {
        uiState.students.className = actionBtn.dataset.class;
        renderApp();
      } else if (action === "select-students-status") {
        uiState.students.statusFilter = actionBtn.dataset.status;
        renderApp();
      } else if (action === "open-student-detail") {
        openStudentDetailModal(actionBtn.dataset.id);
      } else if (action === "view-tx-detail") {
        openTxDetailModal(actionBtn.dataset.txid);
      } else if (action === "open-cancel-tx") {
        openCancelTxModal(actionBtn.dataset.txid);
      } else if (action === "open-refund-tx") {
        openRefundTxModal(actionBtn.dataset.txid);
      } else if (action === "filter-books-grade") {
        uiState.books.gradeFilter = actionBtn.dataset.grade;
        renderApp();
      } else if (action === "quick-add-book-grade") {
        const g = parseInt(actionBtn.dataset.grade, 10) || 10;
        openEditBookModal({ id: "", code: `SACH-K${g}`, title: "", grade: g, price: 65000, status: "selling", note: "" });
      } else if (action === "edit-book") {
        const bk = db.books.find(b => b.id === actionBtn.dataset.bookid);
        if (bk) openEditBookModal(bk);
      } else if (action === "switch-report-subview") {
        uiState.reports.subView = actionBtn.dataset.subview;
        renderApp();
      }
    });

    document.getElementById("btnOpenSettingsModal").addEventListener("click", openSettingsAndBackupModal);
    document.getElementById("btnOpenPwaGuide").addEventListener("click", openPwaGuideModal);
    document.getElementById("btnOpenTestSuite").addEventListener("click", openTestSuiteModal);

    window.ThuTienSachEngine = {
      normalizeVN,
      formatVND,
      formatDateTimeVN,
      getVNDateKey,
      getExcelFileName,
      getBackupZipFileName,
      isValidPhoneVN,
      createInitialDatabase,
      createTestSandboxFixture,
      computeStudentBookStatus,
      computeStudentOverallSummary,
      searchAndSortStudents,
      validateCsvImportRows,
      computeReports,
      buildExcelSheetsData,
      generateXlsxUint8Array,
      createBackupZipBundle,
      validateAndPreviewBackupZip,
      executeRestoreFromBackupZip,
      migrateLocalDataToSupabase,
      createTransactionWithIdempotency,
      uploadToPrivateTransactionBucket,
      createSignedUrlForTransactionImage,
      runAutomatedTests,
      getDb: () => db,
      getUiState: () => uiState,
      getAuthSession: () => authSession,
      setAuthenticated: (val) => { authSession.isAuthenticated = Boolean(val); renderApp(); }
    };

    renderApp();
  })();
  </script>
</body>
